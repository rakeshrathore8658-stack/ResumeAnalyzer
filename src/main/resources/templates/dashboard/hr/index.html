<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('HR Recruiter Dashboard')}"></head>

<body class="dashboard-page">

<div class="dashboard-layout">

    <!-- Shared Sidebar with HR active navigation -->
    <aside th:replace="~{fragments/sidebar :: sidebar(active='dashboard')}"></aside>

    <!-- Main Content Area -->
    <main class="dashboard-main">

        <!-- Shared Topbar -->
        <header th:replace="~{fragments/header :: topbar}"></header>

        <div class="main-content">
            <div th:replace="~{dashboard/index :: #hrDashboardSection}"></div>
        </div>

        <!-- Shared Footer -->
        <footer th:replace="~{fragments/footer :: footer}"></footer>

    </main>

</div>

</body>
</html>
