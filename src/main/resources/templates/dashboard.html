<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Dashboard')}"></head>

<body class="dashboard-page">

<div class="dashboard-layout">

    <!-- Shared Sidebar Fragment -->
    <aside th:replace="~{fragments/sidebar :: sidebar(active='dashboard')}"></aside>

    <!-- Main Content Area -->
    <main class="dashboard-main">

        <!-- Shared Topbar Header Fragment -->
        <header th:replace="~{fragments/header :: topbar}"></header>

        <!-- Main Content (Delegates to shared dashboard view) -->
        <div class="main-content">
            <div th:replace="~{dashboard/index :: #seekerDashboardSection}" th:if="${userRole != 'HR' and userRole != 'RECRUITER'}"></div>
            <div th:replace="~{dashboard/index :: #hrDashboardSection}" th:if="${userRole == 'HR' or userRole == 'RECRUITER'}"></div>
        </div>

        <!-- Shared Footer Fragment -->
        <footer th:replace="~{fragments/footer :: footer}"></footer>

    </main>

</div>

</body>
</html>
