<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ================= SHARED TOPBAR / HEADER ================= -->
<header th:fragment="topbar" class="dashboard-topbar">

    <div class="topbar-left">
        <!-- Sidebar Toggle Button (Open / Close) -->
        <button type="button"
                class="sidebar-menu-button"
                id="sidebarMenuButton"
                aria-label="Toggle navigation"
                aria-controls="dashboardSidebar"
                aria-expanded="false"
                title="Open / Close Sidebar">
            <span aria-hidden="true"><i class="bi bi-list"></i></span>
        </button>

        <!-- Breadcrumbs Fragment Insertion -->
        <nav class="breadcrumb" aria-label="Breadcrumb">
            <a th:href="@{/dashboard}">
                <span class="breadcrumb-icon" aria-hidden="true"><i class="bi bi-speedometer2"></i></span>
                <span>Dashboard</span>
            </a>
            <span class="breadcrumb-separator" aria-hidden="true" th:if="${pageTitle != null}">/</span>
            <span class="breadcrumb-current" th:if="${pageTitle != null}" th:text="${pageTitle}">Overview</span>
        </nav>
    </div>

    <div class="topbar-actions">

        <!-- Role Portal Label (Desktop Only - hidden on mobile to prevent overflow) -->
        <div class="topbar-role-badge">
            <span class="badge badge-primary" th:if="${userRole != 'HR' and userRole != 'RECRUITER'}">
                <i class="bi bi-person-badge"></i> Job Seeker Portal
            </span>
            <span class="badge badge-warning" th:if="${userRole == 'HR' or userRole == 'RECRUITER'}">
                <i class="bi bi-briefcase"></i> Recruiter Portal
            </span>
        </div>

        <!-- Notifications Dropdown Trigger -->
        <div class="notifications-dropdown-wrapper">
            <button type="button"
                    class="topbar-icon-button"
                    id="notificationsTrigger"
                    aria-label="View notifications"
                    aria-expanded="false"
                    aria-haspopup="true">
                <span class="icon-bell" aria-hidden="true"><i class="bi bi-bell"></i></span>
                <span class="notification-badge" id="notificationBadge"
                      th:text="${unreadNotifCount != null ? unreadNotifCount : 0}"
                      th:style="${unreadNotifCount == null or unreadNotifCount == 0} ? 'display: none;' : ''">
                    0
                </span>
            </button>

            <!-- Notifications Dropdown Menu -->
            <div class="notifications-dropdown-menu" id="notificationsDropdown" hidden>
                <div class="dropdown-header">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <strong>Notifications</strong>
                        <span class="header-unread-count" id="headerUnreadCount"
                              th:text="${unreadNotifCount != null ? unreadNotifCount : 0}"
                              th:style="${unreadNotifCount == null or unreadNotifCount == 0} ? 'display: none;' : ''">
                            0
                        </span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <button type="button" 
                                class="btn-mark-all-read-header" 
                                id="btnMarkAllReadHeader" 
                                title="Mark all notifications as read"
                                th:style="${unreadNotifCount == null or unreadNotifCount == 0} ? 'display: none;' : ''">
                            <i class="bi bi-check2-all"></i> Mark all read
                        </button>
                        <a th:href="@{/dashboard/notifications}" class="dropdown-header-link">View all</a>
                    </div>
                </div>
                <div class="notifications-list" id="topbarNotificationsList">
                    <th:block th:if="${topbarNotifications != null and !topbarNotifications.isEmpty()}">
                        <div th:each="notif : ${topbarNotifications}" 
                             class="notification-item-row"
                             th:classappend="${notif.isRead} ? 'is-read' : 'is-unread'"
                             th:data-id="${notif.id}">
                            <a th:href="${notif.actionUrl != null ? notif.actionUrl : '/dashboard/notifications'}"
                               th:class="'notification-item' + (${notif.isRead} ? '' : ' unread')"
                               th:data-id="${notif.id}">
                                <span class="notif-icon" th:style="${notif.iconStyle}" aria-hidden="true">
                                    <i th:class="'bi ' + ${notif.iconClass}"></i>
                                </span>
                                <div class="notif-content">
                                    <p class="notif-title" th:text="${notif.title}">Notification Title</p>
                                    <span class="notif-time" th:text="${notif.timeAgo}">Just now</span>
                                </div>
                            </a>
                            <button type="button" 
                                    class="btn-mark-single-read" 
                                    th:if="${!notif.isRead}"
                                    th:data-id="${notif.id}"
                                    title="Mark as read"
                                    aria-label="Mark notification as read">
                                <span class="unread-dot"></span>
                            </button>
                        </div>
                    </th:block>
                    <div th:if="${topbarNotifications == null or topbarNotifications.isEmpty()}"
                         id="topbarEmptyState"
                         style="padding: 24px 16px; text-align: center; color: var(--text-muted); font-size: 0.85rem;">
                        <i class="bi bi-bell-slash" style="font-size: 1.6rem; display: block; margin-bottom: 8px; opacity: 0.5;"></i>
                        <span>No new notifications</span>
                    </div>
                </div>
                <div class="dropdown-footer">
                    <a th:href="@{/dashboard/notifications}">Open Notification Center →</a>
                </div>
            </div>
        </div>

        <!-- Dark / Light Theme Toggle -->
        <button type="button"
                class="theme-toggle"
                data-theme-toggle
                aria-label="Switch theme"
                aria-pressed="false"
                title="Switch between Light and Dark mode">
            <span class="icon-moon" aria-hidden="true"><i class="bi bi-moon-stars"></i></span>
            <span class="icon-sun" aria-hidden="true"><i class="bi bi-sun"></i></span>
        </button>

        <!-- User Profile Dropdown Trigger -->
        <div class="profile-dropdown-wrapper">
            <button type="button"
                    class="topbar-profile-trigger"
                    id="profileMenuTrigger"
                    aria-label="User account menu"
                    aria-expanded="false"
                    aria-haspopup="true">
                <span class="profile-avatar"
                      th:text="${userName != null and !#strings.isEmpty(userName) ? #strings.substring(userName, 0, 1).toUpperCase() : 'U'}">
                    U
                </span>
                <span class="topbar-profile-name" th:text="${userName != null ? userName : 'User Account'}">
                    User Account
                </span>
                <span class="profile-chevron" aria-hidden="true"><i class="bi bi-chevron-down"></i></span>
            </button>

            <!-- User Profile Dropdown Menu -->
            <div class="profile-dropdown-menu" id="profileDropdown" hidden>
                <div class="profile-menu-header">
                    <strong th:text="${userName != null ? userName : 'User Account'}">User Account</strong>
                    <small th:text="${userEmail != null ? userEmail : 'user@smarthire.local'}">user@smarthire.local</small>
                    <span class="user-role-tag" th:text="${(userRole == 'HR' or userRole == 'RECRUITER') ? 'HR Recruiter' : 'Job Seeker'}">
                        Job Seeker
                    </span>
                </div>
                <div class="profile-menu-links">
                    <a th:href="@{/dashboard/profile}">
                        <span aria-hidden="true"><i class="bi bi-person"></i></span> My Profile
                    </a>
                    <a th:href="@{/dashboard/settings}">
                        <span aria-hidden="true"><i class="bi bi-gear"></i></span> Settings
                    </a>
                    <a th:href="@{/dashboard/help}">
                        <span aria-hidden="true"><i class="bi bi-question-circle"></i></span> Help & Support
                    </a>
                </div>
                <div class="profile-menu-footer">
                    <a th:href="@{/logout}" class="profile-menu-logout-btn" style="text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px;">
                        <span aria-hidden="true"><i class="bi bi-box-arrow-right"></i></span> Sign Out
                    </a>
                </div>
            </div>
        </div>

        <!-- Direct Quick Logout / Sign Out Button -->
        <a th:href="@{/logout}"
           class="topbar-icon-button"
           aria-label="Sign Out"
           title="Sign Out / Logout"
           style="color: var(--danger); text-decoration: none;">
            <span aria-hidden="true"><i class="bi bi-box-arrow-right"></i></span>
        </a>

    </div>

    <!-- Backdrop overlay for mobile drawer -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

</header>

</body>
</html>
