<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SmartHire: AI Powered Resume Analyzer & Recruitment Platform. Build stronger profiles, hire top talent faster.">
    
    <title th:text="${title != null ? title + ' | SmartHire' : 'SmartHire - AI Resume Analyzer & Recruitment Platform'}">SmartHire</title>
    
    <!-- Immediate Theme Application from User Account & DB -->
    <meta name="user-theme" th:content="${theme != null ? theme : (userThemePreference != null ? userThemePreference : '')}">
    <script>
        (function () {
            try {
                var meta = document.querySelector('meta[name="user-theme"]');
                var serverTheme = meta ? meta.getAttribute('content') : null;
                var targetTheme = (serverTheme === "dark" || serverTheme === "light")
                    ? serverTheme
                    : (localStorage.getItem("smarthire-theme") || "light");
                document.documentElement.setAttribute("data-theme", targetTheme);
                document.documentElement.style.colorScheme = targetTheme;
                if (serverTheme === "dark" || serverTheme === "light") {
                    localStorage.setItem("smarthire-theme", serverTheme);
                }
            } catch (e) { }
        })();
    </script>
    
    <!-- Application Stylesheets -->
    <link rel="stylesheet" th:href="@{/css/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/analyzer.css}">
    <link rel="stylesheet" th:href="@{/css/hr.css}">
    
    <!-- Core Application Scripts -->
    <script th:src="@{/js/app.js}" defer></script>
    <script th:src="@{/js/dashboard.js}" defer></script>
    <script th:src="@{/js/hr.js}" defer></script>
</head>
<body>
</body>
</html>
