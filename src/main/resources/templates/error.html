<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${(statusCode != null ? statusCode : (status != null ? status : 500)) + ' - ' + (errorTitle != null ? errorTitle : 'Error') + ' | SmartHire'}">Error | SmartHire</title>
    
    <link rel="stylesheet" th:href="@{/css/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <!-- Early Theme Detection Script (Prevents flash of white in dark mode) -->
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem("smarthire-theme") || "light";
                document.documentElement.setAttribute("data-theme", savedTheme);
                document.documentElement.style.colorScheme = savedTheme;
            } catch (e) {}
        })();
    </script>
    <script th:src="@{/js/app.js}" defer></script>

    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            color: var(--text-primary);
            position: relative;
            overflow-x: hidden;
        }

        .error-navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 36px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
        }

        .error-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--text-primary);
            text-decoration: none;
        }

        .error-brand .brand-mark {
            color: var(--accent);
            font-size: 1.5rem;
            letter-spacing: -2px;
        }

        .error-nav-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .error-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 20px;
        }

        .error-card {
            width: 100%;
            max-width: 620px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 44px 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .error-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent) 0%, var(--primary) 100%);
        }

        .error-code-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 4.8rem;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -0.05em;
            color: var(--accent);
            margin-bottom: 12px;
            font-family: inherit;
        }

        .error-icon-circle {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: grid;
            place-items: center;
            font-size: 2.2rem;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            color: var(--accent);
        }

        .error-icon-circle.danger {
            color: var(--danger);
            border-color: rgba(220, 38, 38, 0.25);
            background: var(--danger-bg);
        }

        .error-icon-circle.warning {
            color: var(--warning);
            border-color: rgba(217, 119, 6, 0.25);
            background: var(--warning-bg);
        }

        .error-icon-circle.info {
            color: var(--accent);
            border-color: rgba(255, 121, 0, 0.25);
            background: var(--accent-light);
        }

        .error-title {
            font-size: clamp(1.4rem, 3vw, 1.85rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .error-description {
            font-size: 0.96rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 24px;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }

        .error-meta-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            margin-bottom: 30px;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            text-align: left;
        }

        .error-meta-box strong {
            color: var(--text-secondary);
            font-weight: 600;
        }

        .error-actions-group {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .error-actions-group .btn {
            padding: 10px 22px;
            font-weight: 600;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .error-footer {
            text-align: center;
            padding: 18px 24px;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            background: var(--bg-primary);
        }

        @media (max-width: 600px) {
            .error-navbar {
                padding: 14px 16px;
            }
            .error-card {
                padding: 32px 18px;
            }
            .error-code-badge {
                font-size: 3.8rem;
            }
            .error-icon-circle {
                width: 60px;
                height: 60px;
                font-size: 1.8rem;
            }
            .error-actions-group {
                flex-direction: column;
                width: 100%;
            }
            .error-actions-group .btn {
                width: 100%;
                justify-content: center;
            }
            .error-meta-box {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body class="error-page">

    <!-- TOPBAR -->
    <header class="error-navbar">
        <a class="error-brand" th:href="@{/}" aria-label="SmartHire Home">
            <span class="brand-mark" aria-hidden="true">///</span>
            <span>SmartHire<span style="color: var(--accent);">.</span></span>
        </a>

        <div class="error-nav-actions">
            <!-- Theme Toggle -->
            <button type="button"
                    class="theme-toggle"
                    data-theme-toggle
                    aria-label="Switch theme"
                    title="Switch between Light and Dark mode"
                    style="width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border-color); background: var(--bg-secondary); cursor: pointer; display: grid; place-items: center;">
                <span class="icon-moon" aria-hidden="true"><i class="bi bi-moon-stars"></i></span>
                <span class="icon-sun" aria-hidden="true"><i class="bi bi-sun"></i></span>
            </button>

            <!-- Dashboard / Home link -->
            <a th:href="@{/dashboard}" class="btn btn-secondary" style="padding: 7px 14px; font-size: 0.85rem; border-radius: var(--radius-md); text-decoration: none;">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
        </div>
    </header>

    <!-- MAIN ERROR CARD -->
    <main class="error-container">
        <article class="error-card">

            <!-- Dynamic Icon according to Status Code -->
            <div th:with="code=${statusCode != null ? statusCode : (status != null ? status : 500)}">

                <!-- 404 Not Found Icon -->
                <div class="error-icon-circle info" th:if="${code == 404}">
                    <i class="bi bi-search"></i>
                </div>

                <!-- 403 Forbidden Icon -->
                <div class="error-icon-circle warning" th:if="${code == 403}">
                    <i class="bi bi-shield-lock-fill"></i>
                </div>

                <!-- 413 File Size Icon -->
                <div class="error-icon-circle warning" th:if="${code == 413}">
                    <i class="bi bi-file-earmark-arrow-up"></i>
                </div>

                <!-- 400 Bad Request Icon -->
                <div class="error-icon-circle warning" th:if="${code == 400}">
                    <i class="bi bi-exclamation-circle-fill"></i>
                </div>

                <!-- 500 / 502 / Default Danger Icon -->
                <div class="error-icon-circle danger" th:if="${code != 404 and code != 403 and code != 413 and code != 400}">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                </div>

                <!-- Big Numeric Status Code Display -->
                <div class="error-code-badge" th:text="${code}">500</div>

                <!-- Error Title -->
                <h1 class="error-title" th:text="${errorTitle != null ? errorTitle : (error != null ? error : 'Something Went Wrong')}">
                    Unexpected Server Error
                </h1>

                <!-- Error Description Message -->
                <p class="error-description" th:text="${errorMessage != null ? errorMessage : (message != null ? message : 'An unexpected condition prevented fulfilling your request. Please try again or return to the dashboard.')}">
                    An unexpected condition prevented fulfilling your request.
                </p>

                <!-- Technical Details Box -->
                <div class="error-meta-box">
                    <div>
                        <span>Path: </span>
                        <strong th:text="${errorPath != null ? errorPath : (path != null ? path : '/')}">/dashboard</strong>
                    </div>
                    <div>
                        <span>Timestamp: </span>
                        <strong th:text="${timestamp != null ? timestamp : 'Just now'}">Just now</strong>
                    </div>
                </div>

                <!-- Action Recovery Buttons -->
                <div class="error-actions-group">
                    <button type="button" class="btn btn-secondary" onclick="window.history.back()">
                        <i class="bi bi-arrow-left"></i> Go Back
                    </button>
                    <a th:href="@{/dashboard}" class="btn btn-primary">
                        <i class="bi bi-speedometer2"></i> Open Dashboard
                    </a>
                    <a th:href="@{/}" class="btn btn-secondary">
                        <i class="bi bi-house-door"></i> Homepage
                    </a>
                </div>

            </div>

        </article>
    </main>

    <!-- FOOTER -->
    <footer class="error-footer">
        © <span id="currentYear">2026</span> SmartHire. AI-Powered Resume Analyzer & Recruitment Platform.
    </footer>

    <script>
        document.getElementById("currentYear").textContent = new Date().getFullYear();
    </script>
</body>
</html>
